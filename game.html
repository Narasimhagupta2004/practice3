<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Trials of Ravana · Astrolive (Dussehra)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --dusk:#1a0f2e; --ink:#0f0820;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:var(--ink);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#0f0820; } }
  :root[data-theme="dark"]{ --ink:#0f0820; }
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;height:100%;background:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #game{width:100%;height:100%}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f6a623;font-family:'Baloo 2',system-ui,sans-serif;font-size:18px}
</style>
</head>
<body>
<div id="loading">Lighting the diyas…</div>
<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
/* =========================================================
   THE 10 TRIALS OF DUSSEHRA — Prototype v0.1
   Flow: Splash → Story → Shami Tree (hub) → Trial of Courage → Reward → Tree grows
   ========================================================= */
const W = 390, H = 780;
const DPR = Math.min(window.devicePixelRatio || 1, 3);
const C = { marigold:0xf6a623, vermilion:0xe2582b, leaf:0x4f9a3a, leafDark:0x2f6b2a, kumkum:0xb3123d, ivory:0xfff3d6, dusk:0x1a0f2e };
const FONT_D = "'Yatra One', Georgia, serif";
const FONT_B = "'Baloo 2', system-ui, sans-serif";

/* ---------- Trial data (structured so trials 2–10 slot in later) ---------- */
const TRIALS = [
  { id:1, key:'courage',       title:'Forest of Courage',     loc:'Forest',        value:'Courage',       icon:'flame'  },
  { id:2, key:'wisdom',        title:'Temple of Wisdom',      loc:'Ancient Temple',value:'Wisdom',        icon:'lotus'  },
  { id:3, key:'unity',         title:'The Vanara Bridge',     loc:'Ocean',         value:'Unity',         icon:'bridge' },
  { id:4, key:'righteousness', title:'The Two Paths',         loc:'Lanka',         value:'Righteousness', icon:'wheel'  },
  { id:5, key:'ravana',        title:'Ravana\u2019s Fortress', loc:'Lanka Fortress',value:'Victory',      icon:'bow'    },
];
const TOTAL=TRIALS.length; const headsDown=n=>Math.min(10,n*2);
const BUILT = TRIALS.map(t=>t.key);
const TREE_STAGES = ['Seedling','Small plant','Young tree','Large Shami tree','Glowing sacred tree'];
const LEVELS = ['Seeker','Brave','Explorer','Guardian','Champion'];
const stageFor = n => n===0?0 : n===1?1 : n===2?2 : n<=9?3 : 4;

/* ---------- Save (per-device) ---------- */
const SAVE_KEY = 'astrolive_ten_trials_v1';
function loadSave(){ try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && Array.isArray(s.tokens)){ if(!s.bests){ s.bests={}; if(s.best) s.bests.courage=s.best; } return s; } }catch(e){} return { tokens:[], bests:{}, seenIntro:false }; }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(STATE)); }catch(e){} }
let STATE = loadSave();
STATE.bests=STATE.bests||{}; STATE.attempts=STATE.attempts||{}; STATE.points=STATE.points||0; STATE.claimed=STATE.claimed||{};
if(STATE.tokens.length&&STATE.seenIntro&&STATE.started===undefined) STATE.started=true;

/* ---------- Campaign config: the host app can override any of this via window.DUSSEHRA_CONFIG ---------- */
const CONFIG=Object.assign({
  brand:'Astrolive',
  milestones:{
    1:{ id:'dus_t1', title:'Participation reward', detail:'10 Astrocash added to your wallet' },
    3:{ id:'dus_t3', title:'Halfway bonus',        detail:'25 bonus Astrocash' },
  },
  finalReward:{ id:'dus_t5', title:'Dussehra Champion Reward', detail:'100 Astrocash + a free 5-minute consultation', code:'DUSSEHRA100' },
}, window.DUSSEHRA_CONFIG||{});

/* ---------- Analytics + host-app bridge (window.AstroliveBridge, or a React Native WebView) ---------- */
const EVENTS=[];
function track(name,props={}){
  const e={event:name,...props,ts:Date.now()}; EVENTS.push(e); if(EVENTS.length>80) EVENTS.shift();
  try{ (window.dataLayer=window.dataLayer||[]).push(e); }catch(_){}
  try{ window.AstroliveBridge&&window.AstroliveBridge.track&&window.AstroliveBridge.track(name,props); }catch(_){}
  try{ window.ReactNativeWebView&&window.ReactNativeWebView.postMessage(JSON.stringify({type:'track',...e})); }catch(_){}
}
function bridge(action,payload={}){
  try{ if(window.AstroliveBridge&&typeof window.AstroliveBridge[action]==='function'){ window.AstroliveBridge[action](payload); return true; } }catch(_){}
  try{ if(window.ReactNativeWebView){ window.ReactNativeWebView.postMessage(JSON.stringify({type:action,...payload})); return true; } }catch(_){}
  return false;
}
function trackFail(sceneKey){ const t=TRIALS.find(x=>x.scene===sceneKey); if(!t) return; track('dussehra_trial_failed',{trial_number:t.id,trial:t.key,attempt_count:STATE.attempts[t.key]||1}); STATE.attempts[t.key]=(STATE.attempts[t.key]||1)+1; save(); }
function heroLook(){ return {col:(STATE.hero&&STATE.hero.col)||C.marigold,hair:0x2a1608}; }
function heroName(){ return (STATE.hero&&STATE.hero.name)||'Hero'; }

/* ---------- Tiny synth (no audio files needed) ---------- */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,type='sine',v=0.12,when=0){ const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=f; const t=a.currentTime+when; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+0.05); }
function sfx(n){
  switch(n){
    case 'tap':  tone(660,0.08,'triangle',0.07); break;
    case 'orb':  tone(1046,0.1,'sine',0.09); tone(1568,0.12,'sine',0.06,0.05); break;
    case 'jump': tone(420,0.12,'triangle',0.07); tone(640,0.1,'triangle',0.05,0.06); break;
    case 'duck': tone(300,0.1,'triangle',0.06); break;
    case 'hit':  tone(110,0.3,'sawtooth',0.13); break;
    case 'bell': [880,1320].forEach((f,i)=>tone(f,1.2,'sine',0.08,i*0.02)); break;
    case 'win':  [523,659,784,1046].forEach((f,i)=>tone(f,0.35,'triangle',0.1,i*0.12)); break;
    case 'head': tone(196,0.6,'square',0.06); tone(98,0.7,'sawtooth',0.07,0.1); break;
    case 'grow': [392,523,659,784,988].forEach((f,i)=>tone(f,0.3,'sine',0.09,i*0.09)); break;
    case 'count':tone(520,0.12,'triangle',0.08); break;
    case 'go':   tone(780,0.25,'triangle',0.1); break;
  }
}

/* ---------- Drawing helpers ---------- */
function txt(s,x,y,str,size,o={}){
  const style = { fontFamily:o.display?FONT_D:FONT_B, fontSize:size+'px', color:o.color||'#fff3d6', align:o.align||'center', resolution:DPR };
  if (o.bold) style.fontStyle = 'bold';
  if (o.wrap) style.wordWrap = { width:o.wrap, useAdvancedWrap:true };
  if (o.stroke) { style.stroke = o.stroke; style.strokeThickness = o.strokeW||4; }
  if (o.lineSpacing) style.lineSpacing = o.lineSpacing;
  return s.add.text(x,y,str,style).setOrigin(o.ox??0.5, o.oy??0.5);
}
function gradTex(s,key,stops){
  if (s.textures.exists(key)) return;
  const t = s.textures.createCanvas(key,W,H), ctx = t.getContext(), g = ctx.createLinearGradient(0,0,0,H);
  stops.forEach(([o,c])=>g.addColorStop(o,c)); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); t.refresh();
}
function stars(s,n,maxY){ for(let i=0;i<n;i++){ const d=s.add.image(Math.random()*W, Math.random()*maxY,'spark').setAlpha(0.2+Math.random()*0.6).setScale(0.3+Math.random()*0.5); s.tweens.add({targets:d,alpha:0.1,duration:800+Math.random()*2000,yoyo:true,repeat:-1,delay:Math.random()*1500}); } }
function stringLights(s,y0,sag){
  const cols=[0xffd166,0xff6b6b,0x7bdff2,0xf7aef8,0xb9fbc0];
  const g=s.add.graphics(); g.lineStyle(1,0x000000,0.6); g.beginPath();
  for(let i=0;i<=40;i++){ const t=i/40, x=t*W, y=y0+Math.sin(t*Math.PI)*sag; i?g.lineTo(x,y):g.moveTo(x,y); } g.strokePath();
  for(let i=1;i<16;i++){ const t=i/16, x=t*W, y=y0+Math.sin(t*Math.PI)*sag+3;
    const d=s.add.image(x,y,'dot').setScale(0.32).setTint(cols[i%5]).setBlendMode('ADD');
    s.add.image(x,y,'glow').setScale(0.18).setTint(cols[i%5]).setAlpha(0.5).setBlendMode('ADD');
    s.tweens.add({targets:d,alpha:0.35,duration:500+Math.random()*900,yoyo:true,repeat:-1,delay:Math.random()*800}); }
}
function diya(s,x,y,sc=1){
  s.add.image(x,y-8*sc,'glow').setScale(0.55*sc).setTint(0xff9a2e).setAlpha(0.45).setBlendMode('ADD');
  const g=s.add.graphics(); g.fillStyle(0x9a3412,1); g.fillEllipse(x,y,26*sc,10*sc); g.fillStyle(0xc2410c,1); g.fillEllipse(x,y-3*sc,26*sc,6*sc);
  const f=s.add.image(x,y-10*sc,'dot').setTint(0xffc14d).setScale(0.32*sc,0.6*sc).setBlendMode('ADD');
  s.tweens.add({targets:f,scaleY:0.45*sc,scaleX:0.26*sc,duration:180+Math.random()*200,yoyo:true,repeat:-1});
}
function rangoli(s,x,y,r){
  const g=s.add.graphics(); const cols=[0xe2582b,0xf6a623,0xb3123d,0x7bdff2];
  for(let k=3;k>=0;k--){ g.fillStyle(cols[k],0.85); for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; g.fillEllipse(x+Math.cos(a)*r*(k+1)/4, y+Math.sin(a)*r*0.38*(k+1)/4, r*0.5*(k+1)/4, r*0.2*(k+1)/4); } }
  g.fillStyle(0xfff3d6,1); g.fillEllipse(x,y,10,5);
}

/* Shami tree — the hub and the progression meter */
function drawTree(s,x,y,stage,o={}){
  const c=s.add.container(x,y);
  if (o.glow || stage===4){ const gl=s.add.image(0,-110,'glow').setScale(3.4).setTint(0xffd36b).setAlpha(0.35).setBlendMode('ADD'); c.add(gl); s.tweens.add({targets:gl,alpha:0.6,scale:3.8,duration:1400,yoyo:true,repeat:-1}); c.glow=gl; }
  const g=s.add.graphics(); c.add(g);
  g.fillStyle(0x3b2a1a,1); g.fillEllipse(0,4,150,22);
  if (stage===0){
    g.lineStyle(5,0x6b8f3a,1); g.beginPath(); g.moveTo(0,0); g.lineTo(0,-36); g.strokePath();
    g.fillStyle(0x8cc04b,1); g.fillEllipse(-13,-38,26,11); g.fillEllipse(13,-45,26,11);
    return c;
  }
  const s0=[0,0.6,0.8,1,1.1][stage], th=[0,55,85,115,135][stage], top=-th;
  g.fillStyle(0x5a3a22,1); g.fillPoints([{x:-13*s0,y:0},{x:13*s0,y:0},{x:5*s0,y:top},{x:-5*s0,y:top}],true);
  const blobs=[[0,0,1],[-38,10,0.8],[38,10,0.8],[-22,-26,0.75],[22,-26,0.75],[0,-42,0.65],[-58,28,0.55],[58,28,0.55]];
  const n=[0,4,6,8,8][stage];
  if (stage>=2){ g.lineStyle(5*s0,0x5a3a22,1); blobs.slice(1,n).forEach(([bx,by])=>{ g.beginPath(); g.moveTo(0,top+20); g.lineTo(bx*s0*0.8,top+by*s0*0.8); g.strokePath(); }); }
  blobs.slice(0,n).forEach(([bx,by,r])=>{ g.fillStyle(C.leafDark,1); g.fillCircle(bx*s0,top+by*s0,34*r*s0); });
  blobs.slice(0,n).forEach(([bx,by,r])=>{ g.fillStyle(C.leaf,1); g.fillCircle(bx*s0-6*s0,top+by*s0-8*s0,22*r*s0); });
  if (stage>=3){ const pts=[[-30,-10],[25,-30],[40,12],[-12,-48],[5,8],[-50,22],[55,30],[-20,20]]; pts.forEach(([px,py])=>{ g.fillStyle(0xffe08a,1); g.fillCircle(px*s0,top+py*s0,2.5); }); }
  if (o.lights){ const lp=[[-30,-5],[28,-20],[0,-40],[-45,25],[45,22],[-15,15],[18,8],[-28,-30],[35,-2],[0,5]];
    lp.slice(0,o.lights).forEach(([px,py],i)=>{ const gl=s.add.image(px*s0,top+py*s0,'glow').setScale(0.22).setTint(0xffd36b).setBlendMode('ADD'); const d=s.add.image(px*s0,top+py*s0,'dot').setScale(0.28).setTint(0xfff1a8); c.add([gl,d]); s.tweens.add({targets:gl,alpha:0.4,duration:700+i*90,yoyo:true,repeat:-1}); }); }
  return c;
}

/* Ravana silhouette with ten removable heads */
function drawRavana(s,x,y,remaining,o={}){
  const col=o.color??0x1b0e24, eye=o.eye??0xff3b3b;
  const c=s.add.container(x,y);
  const heads=[];
  for(let i=0;i<10;i++){
    const off=i-4.5, hx=off*17, hy=-100-(4.5-Math.abs(off))*3;
    const big=(i===4||i===5)?1.15:1;
    const h=s.add.container(hx,hy), hg=s.add.graphics();
    hg.fillStyle(col,1); hg.fillCircle(0,0,10*big); hg.fillTriangle(-7*big,-6*big,7*big,-6*big,0,-20*big);
    hg.fillStyle(eye,1); hg.fillCircle(-3.5,0,1.8); hg.fillCircle(3.5,0,1.8);
    h.add(hg); c.add(h); heads.push(h);
  }
  const b=s.add.graphics(); b.fillStyle(col,1);
  b.fillPoints([{x:-40,y:0},{x:40,y:0},{x:28,y:-88},{x:-28,y:-88}],true);
  b.fillRect(-32,0,24,62); b.fillRect(8,0,24,62);
  b.fillPoints([{x:-28,y:-86},{x:-72,y:-36},{x:-60,y:-26},{x:-24,y:-62}],true);
  b.fillPoints([{x:28,y:-86},{x:72,y:-36},{x:60,y:-26},{x:24,y:-62}],true);
  b.fillRect(64,-96,5,72);
  c.add(b);
  const order=[9,0,8,1,7,2,6,3,5,4];
  order.slice(0,10-remaining).forEach(i=>heads[i].setVisible(false));
  return { c, heads, order };
}

function button(s,x,y,w,h,label,cb,o={}){
  const c=s.add.container(x,y), bg=s.add.graphics(), col=o.color??C.marigold;
  bg.fillStyle(0x000000,0.35); bg.fillRoundedRect(-w/2,-h/2+4,w,h,h/2);
  bg.fillStyle(col,1); bg.fillRoundedRect(-w/2,-h/2,w,h,h/2);
  bg.fillStyle(0xffffff,0.18); bg.fillRoundedRect(-w/2+6,-h/2+3,w-12,h*0.38,h*0.2);
  const t=txt(s,0,0,label,o.size||20,{bold:true,color:o.text||'#2a1206'});
  c.add([bg,t]); c.setSize(w,h); c.setInteractive({useHandCursor:true});
  c.on('pointerdown',()=>{ ac(); sfx('tap'); s.tweens.add({targets:c,scale:0.94,duration:70,yoyo:true}); cb(); });
  c.label=t; return c;
}
function toast(s,msg){
  if (s._toast) s._toast.destroy();
  const c=s.add.container(W/2,H-110).setDepth(100).setScrollFactor(0);
  const t=txt(s,0,0,msg,15,{wrap:300,color:'#fff3d6'});
  const bg=s.add.graphics(); bg.fillStyle(0x000000,0.75); bg.fillRoundedRect(-t.width/2-16,-t.height/2-10,t.width+32,t.height+20,14);
  c.add([bg,t]); c.setAlpha(0); s._toast=c;
  s.tweens.add({targets:c,alpha:1,y:H-125,duration:200});
  s.time.delayedCall(2000,()=>{ if(c.active) s.tweens.add({targets:c,alpha:0,duration:250,onComplete:()=>c.destroy()}); });
}
function goTo(s,key,data){ s.cameras.main.fadeOut(300,15,8,32); s.cameras.main.once('camerafadeoutcomplete',()=>s.scene.start(key,data)); }

/* =========================================================
   SCENES
   ========================================================= */
class Boot extends Phaser.Scene{
  constructor(){ super('Boot'); }
  create(){
    const g=this.add.graphics();
    g.fillStyle(0xffffff,1); g.fillCircle(8,8,8); g.generateTexture('dot',16,16); g.clear();
    g.fillStyle(0xffffff,1); g.fillCircle(3,3,3); g.generateTexture('spark',6,6); g.destroy();
    const t=this.textures.createCanvas('glow',128,128), ctx=t.getContext(), rg=ctx.createRadialGradient(64,64,0,64,64,64);
    rg.addColorStop(0,'rgba(255,255,255,1)'); rg.addColorStop(0.35,'rgba(255,255,255,0.35)'); rg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,128,128); t.refresh();
    document.getElementById('loading')?.remove();
    this.scene.start('AstroHome');
  }
}

/* ---------- Campaign screens: Astrolive home → campaign → intro → hub → trial intro ---------- */
function drawRama(s,x,y,sc=1){
  const c=s.add.container(x,y);
  const gl=s.add.image(0,-10,'glow').setScale(2.4).setTint(0xffd36b).setAlpha(0.45).setBlendMode('ADD');
  const r=s.add.graphics();
  r.fillStyle(0xf6a623,1); r.fillRoundedRect(-16,-10,32,58,10); r.fillStyle(0x2563eb,1); r.fillCircle(0,-26,15); r.fillRect(-22,-6,8,30); r.fillRect(14,-6,8,30);
  r.fillStyle(0xfacc15,1); r.fillTriangle(-13,-38,13,-38,0,-62); r.fillRect(-14,-42,28,6);
  r.lineStyle(4,0xc8a46a,1); r.beginPath(); r.arc(30,8,42,-1.25,1.25); r.strokePath(); r.lineStyle(1.5,0xfff3d6,1); r.lineBetween(30+Math.cos(-1.25)*42,8+Math.sin(-1.25)*42,30+Math.cos(1.25)*42,8+Math.sin(1.25)*42);
  c.add([gl,r]); c.setScale(sc); s.tweens.add({targets:gl,alpha:0.25,duration:1400,yoyo:true,repeat:-1}); return c;
}
function drawHeadTracker(s,x,y,defeated,sz=1){
  const c=s.add.container(x,y), icons=[];
  for(let i=0;i<10;i++){ const ic=s.add.container((i-4.5)*30*sz,0), g=s.add.graphics();
    g.fillStyle(0x3a1036,1); g.fillCircle(0,0,11); g.fillTriangle(-8,-6,8,-6,0,-19); g.fillStyle(0xff4d4d,1); g.fillCircle(-4,0,2); g.fillCircle(4,0,2);
    const xg=s.add.graphics(); xg.lineStyle(4,0xef4444,1); xg.lineBetween(-10,-10,10,10); xg.lineBetween(10,-10,-10,10);
    ic.add([g,xg]); xg.setVisible(i<defeated); if(i<defeated) g.setAlpha(0.35); ic.setScale(sz); c.add(ic); icons.push({ic,g,x:xg}); }
  return {c,icons};
}
function crossHead(s,icon){ icon.x.setVisible(true).setScale(0); s.tweens.add({targets:icon.x,scale:1,duration:350,ease:'Back.out'}); s.tweens.add({targets:icon.g,alpha:0.35,duration:350}); }
function freshState(){ return { tokens:[], bests:{}, seenIntro:false, attempts:{}, points:0, claimed:{} }; }

/* A stand-in for the Astrolive home screen, so the banner → campaign → reward loop can be tested end to end */
class AstroHome extends Phaser.Scene{
  constructor(){ super('AstroHome'); }
  create(data){
    this.cameras.main.fadeIn(300,15,8,32);
    this.add.rectangle(0,0,W,H,0xf5f3ff).setOrigin(0);
    const hd=this.add.graphics(); hd.fillStyle(0x2e1065,1); hd.fillRect(0,0,W,112);
    txt(this,20,40,CONFIG.brand,24,{bold:true,color:'#ffffff',ox:0});
    txt(this,20,72,STATE.hero?`Namaste, ${heroName()}`:'Namaste',14,{color:'#ddd6fe',ox:0});
    txt(this,W-20,40,'demo home',11,{color:'#a78bfa',ox:1});
    // Dussehra campaign banner
    const n=STATE.tokens.length, b=this.add.container(W/2,226), bg=this.add.graphics();
    bg.fillStyle(0x000000,0.18); bg.fillRoundedRect(-172,-92,344,190,20);
    bg.fillStyle(0x3b0a0a,1); bg.fillRoundedRect(-172,-96,344,190,20); bg.fillStyle(0x7c2d12,0.85); bg.fillRoundedRect(-172,-6,344,100,{tl:0,tr:0,bl:20,br:20});
    const rv=drawRavana(this,120,40,10-headsDown(n),{color:0x1b0e24,eye:0xff4d4d}); rv.c.setScale(0.55);
    const tr=drawTree(this,-130,80,stageFor(headsDown(n)),{glow:true,lights:headsDown(n)}); tr.setScale(0.45);
    const glow=this.add.image(0,-10,'glow').setScale(3).setTint(0xf6a623).setAlpha(0.2).setBlendMode('ADD');
    b.add([bg,glow,rv.c,tr,

/* ---------- Temple symbols (used by Trial 2 and token icons) ---------- */
const SYMS=['sun','moon','lotus','flame','star','bow'];
const SYM_COL={wheel:0x1e3a8a,diya:0x9a3412,eye:0x1e3a8a,heart:0xe11d48,scale:0x7c2d12,mace:0x7c2d12,bridge:0x7c2d12,sun:0xf6c343,moon:0xc7d2fe,lotus:0xf472b6,flame:0xe2582b,star:0x7bdff2,bow:0xd9a066};
const SLOT=0x3b2f45, STONE=0x4a3d52;
function drawSymbol(s,key,x,y,r,bg=SLOT){
  const c=s.add.container(x,y), g=s.add.graphics(); c.add(g); const col=SYM_COL[key];
  if(key==='sun'){ g.fillStyle(col,1); for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; g.fillTriangle(Math.cos(a-0.2)*r*0.5,Math.sin(a-0.2)*r*0.5,Math.cos(a+0.2)*r*0.5,Math.sin(a+0.2)*r*0.5,Math.cos(a)*r,Math.sin(a)*r); } g.fillCircle(0,0,r*0.5); }
  else if(key==='moon'){ g.fillStyle(col,1); g.fillCircle(0,0,r*0.8); g.fillStyle(bg,1); g.fillCircle(r*0.4,-r*0.2,r*0.66); }
  else if(key==='lotus'){ g.fillStyle(col,1); [-62,-31,0,31,62].forEach(d=>{ const a=Phaser.Math.DegToRad(d), by=r*0.45, tx=Math.sin(a)*r*0.95, ty=by-Math.cos(a)*r*1.1, mx=tx/2, my=(by+ty)/2, px=Math.cos(a)*r*0.24, py=Math.sin(a)*r*0.24; g.fillPoints([{x:0,y:by},{x:mx-px,y:my-py},{x:tx,y:ty},{x:mx+px,y:my+py}],true); }); g.fillStyle(0xfbcfe8,1); g.fillEllipse(0,r*0.5,r*1.3,r*0.28); }
  else if(key==='flame'){ g.fillStyle(col,1); g.fillTriangle(-r*0.45,r*0.3,r*0.45,r*0.3,0,-r); g.fillCircle(0,r*0.3,r*0.45); g.fillStyle(0xffe08a,1); g.fillTriangle(-r*0.2,r*0.35,r*0.2,r*0.35,0,-r*0.25); g.fillCircle(0,r*0.4,r*0.2); }
  else if(key==='star'){ const pts=[]; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.42:r; pts.push({x:Math.cos(a)*rr,y:Math.sin(a)*rr}); } g.fillStyle(col,1); g.fillPoints(pts,true); }
  else if(key==='wheel'){ g.lineStyle(r*0.16,col,1); g.strokeCircle(0,0,r*0.85); g.lineStyle(r*0.1,col,1); for(let i=0;i<8;i++){ const a=i*Math.PI/4; g.lineBetween(Math.cos(a)*r*0.2,Math.sin(a)*r*0.2,Math.cos(a)*r*0.85,Math.sin(a)*r*0.85); } g.fillStyle(col,1); g.fillCircle(0,0,r*0.22); }
  else if(key==='diya'){ g.fillStyle(col,1); g.fillEllipse(0,r*0.45,r*1.7,r*0.7); g.fillStyle(0xc2410c,1); g.fillEllipse(0,r*0.25,r*1.7,r*0.35); g.fillStyle(0xe2582b,1); g.fillTriangle(-r*0.3,r*0.15,r*0.3,r*0.15,0,-r*0.95); g.fillCircle(0,r*0.1,r*0.3); g.fillStyle(0xffe08a,1); g.fillTriangle(-r*0.13,r*0.15,r*0.13,r*0.15,0,-r*0.4); }
  else if(key==='eye'){ g.fillStyle(0xfff3d6,1); g.fillEllipse(0,0,r*2,r*1.1); g.fillStyle(col,1); g.fillCircle(0,0,r*0.45); g.fillStyle(0x0f172a,1); g.fillCircle(0,0,r*0.2); g.lineStyle(r*0.12,col,1); g.strokeEllipse(0,0,r*2,r*1.1); }
  else if(key==='heart'){ g.fillStyle(col,1); g.fillCircle(-r*0.42,-r*0.2,r*0.5); g.fillCircle(r*0.42,-r*0.2,r*0.5); g.fillTriangle(-r*0.9,0,r*0.9,0,0,r*0.95); }
  else if(key==='scale'){ g.fillStyle(col,1); g.fillRect(-r*0.08,-r*0.75,r*0.16,r*1.5); g.fillRect(-r*0.45,r*0.7,r*0.9,r*0.14); g.fillRect(-r*0.9,-r*0.6,r*1.8,r*0.12); g.fillTriangle(-r*0.95,r*0.05,-r*0.45,r*0.05,-r*0.7,-r*0.55); g.fillTriangle(r*0.45,r*0.05,r*0.95,r*0.05,r*0.7,-r*0.55); }
  else if(key==='mace'){ g.fillStyle(col,1); g.fillRect(-r*0.1,-r*0.1,r*0.2,r*1.1); g.fillCircle(0,-r*0.35,r*0.5); g.fillRect(-r*0.25,r*0.9,r*0.5,r*0.14); g.fillStyle(0xffe08a,1); g.fillRect(-r*0.5,-r*0.4,r,r*0.1); g.fillRect(-r*0.05,-r*0.85,r*0.1,r); }
  else if(key==='bridge'){ g.lineStyle(r*0.2,col,1); g.beginPath(); g.arc(0,r*0.55,r*0.9,Math.PI,0); g.strokePath(); g.lineStyle(r*0.14,col,1); g.lineBetween(-r,r*0.55,r,r*0.55); [-0.55,-0.2,0.2,0.55].forEach(f=>g.lineBetween(f*r,r*0.55,f*r,r*0.55-Math.sqrt(Math.max(0,0.81-f*f))*r)); }
  else if(key==='bow'){ g.lineStyle(r*0.16,col,1); g.beginPath(); g.arc(-r*0.35,0,r*0.85,-1.15,1.15); g.strokePath(); const ex=-r*0.35+Math.cos(1.15)*r*0.85, ey=Math.sin(1.15)*r*0.85; g.lineStyle(2,0xfff3d6,0.9); g.lineBetween(ex,-ey,ex,ey); g.lineStyle(3,0xfff3d6,1); g.lineBetween(ex-r*0.25,0,r*0.75,0); g.fillStyle(0xfff3d6,1); g.fillTriangle(r*0.72,-r*0.16,r*0.72,r*0.16,r,0); }
  return c;
}

/* ---------- Vanara roles + art ---------- */
const ROLES={
  B:{name:'Builder', col:0xf59e0b, need:'build',   short:'builds its span + the one ahead', desc:'builds the span beside it and the next span toward Lanka.'},
  H:{name:'Carrier',  col:0x4ade80, need:'stones',  short:'carries stones: its span ±1',     desc:'carries stones to the span beside it, the one above and the one below.'},
  W:{name:'Warrior', col:0xef4444, need:'serpent', short:'guards from serpents: span ±1',   desc:'guards the span beside it and its neighbours from sea serpents.'},
  S:{name:'Scout',   col:0x60a5fa, need:'fog',     short:'sees through fog: up to 2 away',  desc:'sees through fog up to 2 spans away in either direction.'},
};
function needIcon(s,type,x,y,sc=1){
  const c=s.add.container(x,y), g=s.add.graphics(); c.add(g);
  if(type==='stones'){ const p=[[-5,3],[5,3],[0,-4]]; g.fillStyle(0x4b5563,1); p.forEach(([a,b])=>g.fillCircle(a,b+1.2,5.5)); g.fillStyle(0xc4c9d1,1); p.forEach(([a,b])=>g.fillCircle(a,b,5)); }
  else if(type==='build'){ g.fillStyle(0xa16207,1); g.fillRect(-1.8,-3,3.6,12); g.fillStyle(0xd1d5db,1); g.fillRect(-8,-8,16,6); }
  else if(type==='serpent'){ g.fillStyle(0x14b8a6,1); g.fillCircle(-7,3,4); g.fillCircle(-2,-1,4); g.fillCircle(3,2,4); g.fillCircle(8,-3,4.5); g.fillStyle(0xfff3d6,1); g.fillCircle(9,-4,1.5); }
  else if(type==='fog'){ g.fillStyle(0xe5e7eb,1); g.fillEllipse(-3,1,14,9); g.fillEllipse(4,-2,12,9); g.fillEllipse(2,3,16,7); }
  c.setScale(sc); return c;
}
function drawVanara(s,role,x,y,sc=1){
  const c=s.add.container(x,y), g=s.add.graphics(), col=ROLES[role].col;

    if(r==='S'){ const todo=this.spans.filter(s=>!s.scouted).slice(0,2); if(!todo.length){ toast(this,'Every rock is already found.'); return; }
      this.busy(card); const v=this.team.S; const sx=v.x; this.tweens.add({targets:v,x:todo[todo.length-1].x,y:GROUND-60,duration:900,yoyo:true,ease:'Sine.inOut',onComplete:()=>{ v.x=sx; v.y=GROUND-20; }}); tone(660,0.12,'triangle',0.07);

  /* ---------- trial complete (in-world) ---------- */
  trialComplete(key){
    if(STATE.tokens.includes(key)) return;
    const t=TRIALS.find(x=>x.key===key), prevT=STATE.tokens.length, prev=headsDown(prevT);
    STATE.tokens.push(key); STATE.points+=100; const nowT=STATE.tokens.length, now=headsDown(nowT);
    if(this.rv&&key!=='ravana') while(this.rvLeft>10-now){ const i=this.rv.order[10-this.rvLeft]; this.rv.heads[i].setVisible(false); this.rvLeft--; }
    const secs=Math.round((Date.now()-(STATE.tStart||Date.now()))/1000);
    let score, line;
    if(key==='courage'){ score=this.orbsGot*10+Math.round(this.light*100)-this.wrongPaths*30; line=`Light gathered ${this.orbsGot} · wrong turns ${this.wrongPaths}`; }
    else if(key==='wisdom'){ score=300-this.wrongDoors*100; line=this.wrongDoors?`Wrong doors ${this.wrongDoors}`:'Opened the true door first try'; }
    else if(key==='unity'){ score=Math.max(0,400-(this.bridgeSecs||60)*3-this.waste*30); line=`Bridge built in ${this.bridgeSecs||'-'}s · stones lost ${this.waste}`; }
    else if(key==='righteousness'){ score=this.pathChoice==='right'?this.helped4*100:Math.round(this.coins/2); line=this.pathChoice==='right'?`Village path · helped ${this.helped4}/3`:`Golden road · ${this.coins} coins, nobody helped`; STATE.helped4=this.helped4; }
    else { score=Math.max(0,this.hp*100-(this.falls||0)*50)+Math.max(0,300-this.misses*100)+(this.mercy?200:0); line=`Hearts left ${this.hp} · ${this.mercy?'showed mercy':'no mercy'}`; }
    STATE.bests[key]=Math.max(STATE.bests[key]??-999,score); save();
    track('dussehra_trial_completed',{trial_number:t.id,trial:key,time_taken:secs,score,attempt_count:STATE.attempts[key]||1,first_clear:true});
    if(t.id===3||t.id===5) track(`dussehra_trial_${t.id}_completed`,{time_taken:secs});
    this.mode='overlay'; this.moveDir=0;

  drawLanka(){

  update(time,delta){

    const dt=Math.min(delta,50)/1000, h=this.hero;

    if(this.air||this.vy<0){ this.vy+=1100*dt; h.y+=this.vy*dt; if(h.y>=GROUND){ h.y=GROUND; this.vy=0; this.air=false; } }

    this.sun.setAlpha(seg.key==='ocean'?0.6:seg.key==='temple'?0.3:0);
    if(seg!==this.lastSeg){ this.lastSeg=seg; this.areaTxt.setText(seg.trial?`Trial ${TRIALS.find(t=>t.key===seg.trial).id} · ${seg.name}`:seg.name); }

    // context action button
    if(this.mode==='walk'&&!this.talking){ const a=this.contextAction(); this.btnA.setVisible(!!a); if(a) this.btnA.label.setText(a.label); }
    // forest: light, orbs, thorns, whispers of doubt
    const inForest=h.x>760&&h.x<2620;
    this.orbs.forEach(o=>{ if(!o.got&&Math.abs(o.x-h.x)<26&&Math.abs(o.y-(h.y-35))<44){ o.got=true; this.orbsGot++; this.light=Math.min(1,this.light+0.08); o.o.destroy(); o.c.destroy(); tone(990,0.08,'sine',0.07); } });
    if(this.hurtT>0) this.hurtT-=dt;
    this.thorns.forEach(t=>{ if(this.hurtT<=0&&Math.abs(t.x-h.x)<24&&h.y>GROUND-30){ this.hurtT=1; this.light=Math.max(0.15,this.light-0.12); sfx('hit'); this.cameras.main.shake(150,0.008); h.x-=60*this.face; } });
    if(inForest&&this.mode==='walk'&&!this.talking&&!this.paused){ this.wispT=(this.wispT||2.5)-dt; if(this.wispT<=0){ this.wispT=2.6+Math.random()*1.4; this.spawnWisp(); } }
    for(let i=this.wisps.length-1;i>=0;i--){ const w=this.wisps[i]; if(this.talking||this.paused) continue; const dx=h.x-w.o.x, dy=(h.y-50)-w.o.y, d=Math.hypot(dx,dy);
      w.o.x+=dx/d*70*dt; w.o.y+=dy/d*70*dt+Math.sin(time/200+i)*0.6; w.t.setPosition(w.o.x,w.o.y-26);
      if(d<26){ this.light=Math.max(0.15,this.light-0.12); sfx('hit'); this.killWisp(i,false); } }
    this.lightBar.width=62*this.light; [this.lightLbl,this.lightBg,this.lightBar].forEach(o=>o.setVisible(inForest));
    // darkness
    const dk=h.x<760?Phaser.Math.Clamp((h.x-640)/120,0,1):h.x>2560?Phaser.Math.Clamp((2680-h.x)/120,0,1):1;
    this.dark.clear(); if(dk>0.01&&h.x<2700){ this.dark.fill(0x010403,0.92*dk); this.stamp.setScale((70+130*this.light)/38).setPosition(h.x-cam.scrollX,h.y-40); this.dark.erase(this.stamp); this.dark.erase(this.stamp); }
    if(this.mode==='bridge') this.updBridge();
    if(this.mode==='battle') this.updBattle(dt);
    // golden-road coins
    if(this.pathChoice==='easy') this.coinsList.forEach(c=>{ if(!c.got&&Math.abs(c.x-h.x)<24&&Math.abs(c.c.y-(h.y-35))<46){ c.got=true; this.coins+=5; c.c.destroy(); tone(1320,0.06,'square',0.04); } });
    this.coinHud.setText(seg.key==='lanka'&&this.pathChoice==='easy'?`Coins ${this.coins}`:'');
  }
  spawnWisp(){
    const side=Math.random()<0.7?1:-1, cam=this.cameras.main, x=cam.scrollX+(side>0?W+20:-20), y=GROUND-80-Math.random()*120;
    const o=this.add.image(x,y,'glow').setScale(0.55).setTint(0x7c3aed).setBlendMode('ADD').setDepth(32).setInteractive({useHandCursor:true});
    const t=this.add.text(x,y-26,Phaser.Utils.Array.GetRandom(['turn back…','too dark…','you can’t…','go home…']),{fontFamily:FONT_B,fontSize:'12px',color:'#c4b5fd',resolution:DPR}).setOrigin(0.5).setDepth(32);
    const w={o,t}; this.wisps.push(w); o.on('pointerdown',()=>{ const i=this.wisps.indexOf(w); if(i>=0) this.killWisp(i,true); });
  }
  killWisp(i,byTap){ const w=this.wisps[i]; this.wisps.splice(i,1); if(byTap){ tone(1200,0.1,'sine',0.06); const e=this.add.particles(w.o.x,w.o.y,'spark',{speed:{min:40,max:120},lifespan:500,scale:{start:1,end:0},tint:0xfde68a,blendMode:'ADD',emitting:false}).setDepth(33); e.explode(14); this.time.delayedCall(600,()=>e.destroy()); } w.o.destroy(); w.t.destroy(); }
}

    [0,0.15,0.3].forEach(w=>[523,659,784,1046].forEach((f,i)=>tone(f,0.5,'triangle',0.07,w+i*0.14)));
    const t1=txt(this,W/2,300,'VICTORY OF\nGOOD OVER EVIL',38,{display:true,color:'#ffd27a',stroke:'#2a0f2e',strokeW:8,lineSpacing:-4}).setScale(0.5).setAlpha(0).setDepth(30);
    this.tweens.add({targets:t1,scale:1,alpha:1,duration:800,delay:600,ease:'Back.out'});
    const t2=txt(this,W/2,380,'You completed the Trials of Ravana.',17,{bold:true,color:'#fff3d6',stroke:'#2a0f2e',strokeW:4}).setAlpha(0).setDepth(30);
    this.tweens.add({targets:t2,alpha:1,duration:600,delay:1500});

/* ---------- Final reward: Dussehra Champion ---------- */

    this.cameras.main.fadeIn(400,15,8,32);
    const R=CONFIG.finalReward; track('dussehra_reward_viewed',{reward_id:R.id,milestone:10});
    gradTex(this,'champBg',[[0,'#1e1b4b'],[0.55,'#4a1d4f'],[1,'#1a0806']]);
    this.add.image(0,0,'champBg').setOrigin(0); stars(this,50,H);
    this.time.addEvent({delay:900,loop:true,callback:()=>{ const e=this.add.particles(Phaser.Math.Between(40,W-40),Phaser.Math.Between(40,160),'spark',{speed:{min:50,max:160},lifespan:1000,gravityY:80,scale:{start:1.1,end:0},tint:Phaser.Utils.Array.GetRandom([0xffd166,0xf7aef8,0x7bdff2]),blendMode:'ADD',emitting:false}); e.explode(30); this.time.delayedCall(1200,()=>e.destroy()); }});
    txt(this,W/2,72,'DUSSEHRA CHAMPION',32,{display:true,color:'#ffd27a',stroke:'#2a0f2e',strokeW:6});

    const gift=this.add.graphics(); gift.fillStyle(0xb3123d,1); gift.fillRoundedRect(-30,-92,60,46,6); gift.fillStyle(0xe11d48,1); gift.fillRect(-36,-102,72,14); gift.fillStyle(0xfacc15,1); gift.fillRect(-5,-102,10,56); gift.fillEllipse(-12,-108,18,10); gift.fillEllipse(12,-108,18,10);
    const gl=this.add.image(0,-70,'glow').setScale(1.4).setTint(0xffd36b).setAlpha(0.5).setBlendMode('ADD'); this.tweens.add({targets:gl,alpha:0.2,duration:800,yoyo:true,repeat:-1});
    this.codeTxt=txt(this,0,78,'',15,{bold:true,color:'#86efac'});
    c.add([g,gl,gift,txt(this,0,-20,'Your Dussehra Reward',15,{bold:true,color:'#c4b5d6'}),txt(this,0,10,R.title,20,{display:true,color:'#ffd27a',wrap:290}),txt(this,0,44,R.detail,14,{color:'#fff3d6',wrap:290}),this.codeTxt]);
    const claimed=()=>{ this.codeTxt.setText(R.code?`Claimed ✓  ·  code ${R.code}`:'Claimed ✓'); };

    button(this,W/2,668,300,44,'Share your journey',()=>goTo(this,'Share'),{size:15,color:0x3a2350,text:'#fff3d6'});
    const back=txt(this,W/2,726,'Replay the journey',13,{color:'#c4b5d6'}).setInteractive({useHandCursor:true}); back.on('pointerdown',()=>{ STATE.tokens=[]; STATE.path=null; STATE.helpedKinds=[]; save(); goTo(this,'Journey'); });

/* ---------- Shareable journey card ---------- */
class Share extends Phaser.Scene{
  constructor(){ super('Share'); }
  create(){
    this.cameras.main.fadeIn(300,15,8,32);
    this.add.rectangle(0,0,W,H,0x0f0820).setOrigin(0);
    const n=STATE.tokens.length, x0=24, y0=56, w=W-48, h=584; this.card={x0,y0,w,h};
    gradTex(this,'shareBg',[[0,'#2e1065'],[0.5,'#7c2d12'],[1,'#1a0806']]);
    const bgi=this.add.image(0,0,'shareBg').setOrigin(0); const mk=this.make.graphics({x:0,y:0},false); mk.fillStyle(0xffffff); mk.fillRoundedRect(x0,y0,w,h,22); bgi.setMask(mk.createGeometryMask());
    const fr=this.add.graphics(); fr.lineStyle(3,0xffd27a,1); fr.strokeRoundedRect(x0,y0,w,h,22);
    fr.fillStyle(0x000000,0.3); fr.fillRoundedRect(x0,y0,w,46,{tl:22,tr:22,bl:0,br:0});
    txt(this,x0+18,y0+23,`${CONFIG.brand}  ×  Dussehra`,15,{bold:true,color:'#fde68a',ox:0});
    txt(this,W/2,y0+84,'YOUR DUSSEHRA JOURNEY',24,{display:true,color:'#ffd27a'});
    txt(this,W/2,y0+116,heroName(),18,{bold:true,color:'#fff3d6'});
    txt(this,W/2,y0+144,`${n}/${TOTAL} Trials Complete`,15,{color:'#fde4cf'});
    TRIALS.forEach((t,k)=>{ const col=k%2, row=Math.floor(k/2), x=x0+46+col*150, y=y0+200+row*58, ok=STATE.tokens.includes(t.key);
      const g=this.add.graphics(); g.fillStyle(ok?0xf6a623:0x3a2350,1); g.fillCircle(x,y,15); drawSymbol(this,t.icon,x,y,9,ok?0xf6a623:0x3a2350).setAlpha(ok?1:0.4);
      txt(this,x+24,y,`${t.value} ${ok?'✓':''}`,14,{bold:true,color:ok?'#fff3d6':'#7c6a8c',ox:0}); });
    const by=y0+h-92; const bg=this.add.graphics(); bg.fillStyle(0x000000,0.35); bg.fillRoundedRect(x0+30,by-32,w-60,74,16);
    drawSymbol(this,'bow',x0+64,by+5,18,0x1a0f2e);
    txt(this,x0+96,by-4,n>=TOTAL?'DUSSEHRA CHAMPION':'ON THE JOURNEY',20,{display:true,color:'#ffd27a',ox:0}); txt(this,x0+96,by+20,'The Trials of Ravana',12,{color:'#fde4cf',ox:0});
    button(this,W/2-82,692,150,48,'Share',()=>this.share(),{size:17});
    button(this,W/2+82,692,150,48,'Done',()=>goTo(this,STATE.tokens.length>=TOTAL?'Champion':'Journey'),{size:16,color:0x3a2350,text:'#fff3d6'});
    track('dussehra_share_card_viewed',{trials:n});
  }
  share(){
    track('dussehra_share_clicked',{});
    const text=`I completed ${STATE.tokens.length}/${TOTAL} Trials of Ravana on ${CONFIG.brand} this Dussehra! ${TRIALS.filter(t=>STATE.tokens.includes(t.key)).map(t=>t.value+' ✓').join(' ')}`;
    const fallback=async()=>{ try{ if(navigator.share){ await navigator.share({title:'My Dussehra Journey',text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
      try{ await navigator.clipboard.writeText(text); toast(this,'Copied! Paste it anywhere to share.'); }catch(e){ toast(this,'Take a screenshot of your card to share it!'); } };
    if(bridge('shareCard',{text})) return;
    const {x0,y0,w,h}=this.card;
    try{ this.game.renderer.snapshotArea(x0,y0,w,h,img=>{ try{ const cv=document.createElement('canvas'); cv.width=img.width; cv.height=img.height; cv.getContext('2d').drawImage(img,0,0);
        cv.toBlob(async b=>{ try{ const f=new File([b],'dussehra-journey.png',{type:'image/png'}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'My Dussehra Journey',text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } fallback(); },'image/png'); }catch(e){ fallback(); } }); }
    catch(e){ fallback(); }
  }
}

/* ---------- Boot the game once fonts are ready ---------- */
function start(){
  new Phaser.Game({
    type:Phaser.AUTO, parent:'game', backgroundColor:'#0f0820',
    scale:{ mode:Phaser.Scale.FIT, autoCenter:Phaser.Scale.CENTER_BOTH, width:W, height:H },
    dom:{ createContainer:true },
    scene:[Boot,AstroHome,Campaign,Intro,Journey,Celebration,Champion,Share],
    input:{ activePointers:3 },
  });
}
Promise.race([
  Promise.all([document.fonts.load("38px 'Yatra One'"), document.fonts.load("bold 20px 'Baloo 2'"), document.fonts.load("20px 'Baloo 2'")]),
  new Promise(r=>setTimeout(r,1800))
]).catch(()=>{}).then(start);
</script>
